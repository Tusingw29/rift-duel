<!doctype html><html lang="en"><meta charset="utf-8"><base href="../dist/"><title>Sidestep contact review</title><style>body{margin:0;background:#141d26;color:white;font:16px system-ui}canvas{width:100vw;height:100vh;display:block}#label{position:fixed;top:10px;left:14px;background:#121b28dd;padding:10px}</style><canvas id="scene"></canvas><div id="label"></div><script type="module">
import {createView} from '../dist/render.js';import {createMatch,update,neutral} from '../dist/combat.js';import {moveTiming} from '../dist/moves.js';import {fighters} from '../dist/fighters.js';import {applyLinearMove} from '../dist/linear-hits.js';import {startStep} from '../dist/movement-v2.js';
const view=createView(document.querySelector('canvas'),{quality:'low',talaModel:'graphic'});view.quality('low');let ready=false;window.linearReviewView=view;
window.reviewLinear=({linear=true,key='jab',camera='side',frame=20}={})=>{const m=createMatch(3,2,'duel','normal',{movement:'v2',arena:'ring',burst:'v2',step:linear?'linear':''}),[a,b]=m.players;a.x=0;b.x=2;const kind=key==='capture'?'capture':'strike',chain=key==='sweep'?2:1,move={kind,chain,...moveTiming(fighters[3],kind,chain),frame:0,started:0,aimX:1,aimZ:0,connected:false};applyLinearMove(m,'morrow',move);a.move=move;a.cool=move.total/60;a.anim=kind;a.animTime=a.cool;startStep(b,'up',0);for(let n=0;n<frame;n++)update(m,[neutral(),neutral()]);if(!ready){view.match(m,3);ready=true;}view.render(0,m,{quality:'low',camera,reduced:true});document.querySelector('#label').textContent=`${linear?'LINEAR':'HORIZON'} · ${key} · tick ${m.tick} · HP ${b.hp.toFixed(2)} · ${m.cinematic?'CAPTURED':'FREE'}`;return {hp:b.hp,cinematic:!!m.cinematic,tracking:!!move.tracking,moveFrame:move.frame,models:view.fighterModels};};reviewLinear();
</script></html>
