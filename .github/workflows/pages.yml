name: Test and publish Rift Duel
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run prepare:release
      - run: npm test
      - uses: actions/configure-pages@v5
      - name: Exclude local skill dashboard
        run: rm -f dist/skill-lab.html dist/skill-lab.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that this is still the latest main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping superseded commit $GITHUB_SHA; main is $latest_sha."
          fi
      - name: Deploy
        if: steps.current.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
