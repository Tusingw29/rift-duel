<!doctype html><html lang="en"><meta charset="utf-8"><base href="../dist/"><title>Horizon hit check review</title><style>body{margin:0;background:#141d26;color:white;font:16px system-ui}canvas{width:100vw;height:100vh;display:block}#label{position:fixed;top:10px;left:14px;background:#121b28dd;padding:10px}</style><canvas id="scene"></canvas><div id="label"></div><script type="module">
import {createView} from '../dist/render.js';import {createMatch,update,neutral} from '../dist/combat.js';import {arenaRadius} from '../dist/arena-bounds.js';import {startStep} from '../dist/movement-v2.js';
const view=createView(document.querySelector('canvas'),{quality:'low',talaModel:'graphic'});view.quality('low');let m,ready=false;window.horizonView=view;
window.reviewHorizon=({ring=10,camera='lock',scenario='boundary'}={})=>{m=createMatch(3,2,'training','normal',{movement:'v2',arena:'ring',ring,burst:'v2'});const [a,b]=m.players;a.x=0;b.x=3;if(scenario==='boundary'){a.x=ring-1.3;b.x=ring-3.5;}else{for(let n=0;n<23;n++){if(n===8&&scenario==='escape')startStep(b,'back',m.tick);update(m,[{...neutral(),super:n===0},neutral()]);}}a.lookX=Math.sign(b.x-a.x)||1;b.lookX=-a.lookX;a.face=a.lookX;b.face=b.lookX;if(!ready){view.match(m,3);ready=true;}view.render(0,m,{quality:'low',camera,reduced:true});const boundary=view.scene.getObjectByName('playtest-arena-boundary');document.querySelector('#label').textContent=`${scenario} · ${camera} · R=${arenaRadius(m)} · ${m.cinematic?'CONTACT':'NO CINEMATIC'}`;return {radius:arenaRadius(m),drawnRadius:boundary.children[0].geometry.parameters.outerRadius*boundary.scale.x-.11*boundary.scale.x,cinematic:!!m.cinematic,hp:b.hp,moveFrame:a.move?.frame,models:view.fighterModels};};reviewHorizon();
</script></html>
