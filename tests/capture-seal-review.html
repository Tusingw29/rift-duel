<!doctype html><html lang="en"><meta charset="utf-8"><base href="../dist/"><title>Seal collision review</title><style>body{margin:0;background:#101722;color:white;font:14px system-ui}canvas{display:block;width:100vw;height:100vh}#label{position:fixed;top:10px;left:10px;background:#132030ee;padding:10px;max-width:90%}</style><canvas></canvas><div id="label"></div><script type="module">
import * as T from '../dist/vendor/three.module.js';import {createView} from '../dist/render.js';import {createMatch,update,neutral} from '../dist/combat.js';import {SEAL} from '../dist/capture-seal.js';
const view=createView(document.querySelector('canvas'),{quality:'low',talaModel:'graphic'});view.quality('low');window.sealView=view;let initialized=false;const ring=new T.Mesh(new T.TorusGeometry(1,.025,4,64),new T.MeshBasicMaterial({color:0xffca55}));ring.rotation.x=-Math.PI/2;view.scene.add(ring);const collision=new T.Mesh(new T.TorusGeometry(1,.012,3,64),new T.MeshBasicMaterial({color:0x63dafa}));collision.rotation.x=-Math.PI/2;view.scene.add(collision);
window.sealReview=({phase='warning',camera='duel'}={})=>{const m=createMatch(2,3,'duel','normal',{movement:'v2',arena:'ring',step:'linear',seal:'on,dash',grab:'locked,reach,slow16',capturewake:'inv',capdmg:'closehigh'});if(!initialized){view.match(m,3);initialized=true;}let escaped;
 for(let n=0;n<220;n++){if(m.players[0].sealEscape&&escaped===undefined)escaped=m.tick;const go=escaped!==undefined&&m.tick===escaped+2;update(m,[{...neutral(),z:escaped===undefined&&n>=15?1:0,x:go?1:0,attack:go},{...neutral(),capture:n===0}]);view.render(m.frozen?0:1/60,m,{quality:'low',reduced:true,camera,noDraw:true});if(phase==='warning'&&n===24||phase==='escape'&&escaped!==undefined||phase==='dash'&&m.players[0].escapeDash?.frame>=12||phase==='arrival'&&m.players[0].sealPunishUntil)break;}
 const s=m.seals[0];ring.visible=collision.visible=!!s;if(s){ring.position.set(s.x,.08,s.z);ring.scale.setScalar(s.radius);collision.position.set(s.x,.09,s.z);collision.scale.setScalar(s.radius+SEAL.bodyRadius);}view.render(0,m,{quality:'low',reduced:true,camera});const r={phase,camera,tick:m.tick,seals:m.seals,hp:m.players.map(x=>x.hp),gap:Math.hypot(m.players[0].x-m.players[1].x,m.players[0].z-m.players[1].z),escapeDash:m.players[0].escapeDash,reward:m.players[0].sealEscape,punishRemaining:m.players[1].move?m.players[1].move.total-m.players[1].move.frame:0,models:view.fighterModels};document.querySelector('#label').textContent=`${phase} · ${camera} · gap ${r.gap.toFixed(2)} · reserve ${r.punishRemaining}f · DEBUG collision rings only; Claude owns final VFX`;return r;};sealReview();
</script></html>
