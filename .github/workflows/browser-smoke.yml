name: Browser smoke test
on:
  workflow_dispatch:
    inputs:
      url:
        description: Page to test
        default: https://tusingw29.github.io/rift-duel/
        type: string
      tala:
        description: Tala model that must attach (design02, concept)
        default: design02
        type: string
      preview_branch:
        description: Test the checked-out branch locally on the runner before publishing
        default: false
        type: boolean
      review_model:
        description: Also capture model-review face, side, back and guard views
        default: false
        type: boolean
      morrow_only:
        description: Only review the Gravebound model on a branch preview
        default: false
        type: boolean
      review_only:
        description: Only run model-review checks (enable review_model too)
        default: false
        type: boolean
  workflow_run:
    workflows: [Test and publish Rift Duel]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: browser-smoke
  cancel-in-progress: true
jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use the Ubuntu archive for browser dependencies
        run: |
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$apt_source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 pngjs@7.0.0 jpeg-js@0.4.4
          npx playwright install --with-deps chromium
      - name: Wait for the published page to serve the current build
        if: github.event_name == 'workflow_run'
        run: |
          expected=$(node scripts/prepare-release.mjs >/dev/null && grep -o 'build=[a-f0-9]*' dist/index.html | head -1)
          for i in $(seq 1 30); do
            live=$(curl -fsSL "https://tusingw29.github.io/rift-duel/?smoke=$i" | grep -o 'build=[a-f0-9]*' | head -1 || true)
            echo "attempt $i: live $live, expected $expected"
            [ "$live" = "$expected" ] && exit 0
            sleep 20
          done
          echo "Published page never served $expected; testing whatever is live."
      - name: Serve branch preview
        if: inputs.preview_branch
        run: python3 -m http.server 4173 --directory dist > /tmp/rift-preview.log 2>&1 &
      - name: Run the browser smoke test
        if: ${{ !inputs.morrow_only }}
        env:
          SMOKE_URL: ${{ inputs.preview_branch && 'http://127.0.0.1:4173/' || inputs.url || 'https://tusingw29.github.io/rift-duel/' }}
          SMOKE_TALA: ${{ inputs.tala || 'graphic' }}
          REVIEW_MODEL: ${{ inputs.review_model || 'false' }}
          REVIEW_ONLY: ${{ inputs.review_only || 'false' }}
        run: node scripts/browser-smoke.mjs --url "$SMOKE_URL" --tala "$SMOKE_TALA" --review "$REVIEW_MODEL" --review-only "$REVIEW_ONLY" --out artifacts/browser-smoke
      - name: Review Morrow Gravebound
        if: inputs.preview_branch
        run: node scripts/morrow-art-smoke.mjs
      - name: Capture kinetic effects on branch previews
        if: inputs.preview_branch
        run: |
          if [ -f scripts/review/kinetic-vfx.mjs ]; then
            npm run prepare:release
            export RIFT_TOOLS="$PWD" RIFT_BASE=http://127.0.0.1:4173 SHOTS=artifacts/browser-smoke/kinetic-vfx
            node scripts/review/kinetic-vfx.mjs
            node scripts/review/signature-volumes.mjs
          fi
      - name: Upload screenshots, console log and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: artifacts/browser-smoke
          retention-days: 14
