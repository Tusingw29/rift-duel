name: Browser smoke test
on:
  workflow_dispatch:
    inputs:
      grab_retest:
        description: Run rule-aware grab retest (five seeds, both delays)
        default: false
        type: boolean
      grab_study:
        description: Run the opt-in five-seed grab study instead of renderer smoke
        default: false
        type: boolean
      url:
        description: Page to test
        default: https://tusingw29.github.io/rift-duel/
        type: string
      tala:
        description: Tala model that must attach (design02, concept)
        default: design02
        type: string
      preview_branch:
        description: Test the checked-out branch locally on the runner before publishing
        default: false
        type: boolean
      vfx_only:
        description: Capture flowing energy only on a branch preview
        default: false
        type: boolean
      review_model:
        description: Also capture model-review face, side, back and guard views
        default: false
        type: boolean
      morrow_only:
        description: Only review the Gravebound model on a branch preview
        default: false
        type: boolean
      review_only:
        description: Only run model-review checks (enable review_model too)
        default: false
        type: boolean
  workflow_run:
    workflows: [Test and publish Rift Duel]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: ${{ inputs.grab_retest && 'grab-retest' || inputs.grab_study && 'grab-study' || 'browser-smoke' }}
  cancel-in-progress: true
jobs:
  smoke:
    if: inputs.grab_retest != true && inputs.grab_study != true && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use the Ubuntu archive for browser dependencies
        run: |
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$apt_source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 pngjs@7.0.0 jpeg-js@0.4.4
          npx playwright install --with-deps chromium
      - name: Wait for the published page to serve the current build
        if: github.event_name == 'workflow_run'
        run: |
          expected=$(node scripts/prepare-release.mjs >/dev/null && grep -o 'build=[a-f0-9]*' dist/index.html | head -1)
          for i in $(seq 1 30); do
            live=$(curl -fsSL "https://tusingw29.github.io/rift-duel/?smoke=$i" | grep -o 'build=[a-f0-9]*' | head -1 || true)
            echo "attempt $i: live $live, expected $expected"
            [ "$live" = "$expected" ] && exit 0
            sleep 20
          done
          echo "Published page never served $expected; testing whatever is live."
      - name: Serve branch preview
        if: inputs.preview_branch
        run: python3 -m http.server 4173 --directory dist > /tmp/rift-preview.log 2>&1 &
      - name: Run the browser smoke test
        if: ${{ !inputs.morrow_only && !inputs.vfx_only }}
        env:
          SMOKE_URL: ${{ inputs.preview_branch && 'http://127.0.0.1:4173/' || inputs.url || 'https://tusingw29.github.io/rift-duel/' }}
          SMOKE_TALA: ${{ inputs.tala || 'graphic' }}
          REVIEW_MODEL: ${{ inputs.review_model || 'false' }}
          REVIEW_ONLY: ${{ inputs.review_only || 'false' }}
        run: node scripts/browser-smoke.mjs --url "$SMOKE_URL" --tala "$SMOKE_TALA" --review "$REVIEW_MODEL" --review-only "$REVIEW_ONLY" --out artifacts/browser-smoke
      - name: Review Morrow Gravebound
        if: inputs.preview_branch && !inputs.vfx_only
        run: node scripts/morrow-art-smoke.mjs
      - name: Capture kinetic effects on branch previews
        if: inputs.preview_branch && !inputs.vfx_only
        run: |
          if [ -f scripts/review/kinetic-vfx.mjs ]; then
            npm run prepare:release
            export RIFT_TOOLS="$PWD" RIFT_BASE=http://127.0.0.1:4173 SHOTS=artifacts/browser-smoke/kinetic-vfx
            node scripts/review/kinetic-vfx.mjs
            node scripts/review/signature-volumes.mjs
            node scripts/review/frame-budgets.mjs
            node scripts/review/vfx-workbench.mjs
            node scripts/review/refined-energy.mjs
          fi
          if [ -f scripts/review/anim-workbench-probe.mjs ]; then
            npm run prepare:release
            RIFT_TOOLS="$PWD" RIFT_BASE=http://127.0.0.1:4173 SHOTS=artifacts/browser-smoke/anim-workbench node scripts/review/anim-workbench-probe.mjs
          fi
      - name: Review flowing energy only
        if: inputs.preview_branch && inputs.vfx_only
        env:
          RIFT_TOOLS: ${{ github.workspace }}
          RIFT_BASE: http://127.0.0.1:4173
          SHOTS: artifacts/browser-smoke/kinetic-vfx
        run: node scripts/review/refined-energy.mjs
      - name: Review the published VFX workbench
        if: github.event_name == 'workflow_run'
        env:
          RIFT_TOOLS: ${{ github.workspace }}
          RIFT_BASE: https://tusingw29.github.io/rift-duel
          SHOTS: artifacts/browser-smoke/vfx-workbench
        run: |
          node scripts/review/vfx-workbench.mjs
          node scripts/review/refined-energy.mjs
      - name: Review the published animation workbench
        if: github.event_name == 'workflow_run'
        env:
          RIFT_TOOLS: ${{ github.workspace }}
          RIFT_BASE: https://tusingw29.github.io/rift-duel
          SHOTS: artifacts/browser-smoke/anim-workbench
        run: node scripts/review/anim-workbench-probe.mjs
      - name: Upload screenshots, console log and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: artifacts/browser-smoke
          retention-days: 14

  grab-study:
    if: inputs.grab_study == true
    strategy:
      fail-fast: false
      matrix:
        delay: [10, 15]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/skill/grab-tournament.mjs --delay=${{ matrix.delay }} --workers=4
      - uses: actions/upload-artifact@v4
        with:
          name: grab-options-${{ matrix.delay }}
          path: art/skill-lab/2026-10-28-grab-options/*.json.gz

  grab-retest:
    if: inputs.grab_retest == true
    strategy:
      fail-fast: false
      matrix:
        delay: [10, 15]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/skill/grab-retest.mjs --delay=${{ matrix.delay }} --workers=4
      - uses: actions/upload-artifact@v4
        with:
          name: grab-retest-${{ matrix.delay }}
          path: art/skill-lab/2026-10-28-grab-retest/*.json.gz
