<!doctype html><html lang="en"><meta charset="utf-8"><base href="../dist/"><title>Capture loop rule review</title><style>body{margin:0;background:#101722;color:white;font:15px system-ui}canvas{display:block;width:100vw;height:100vh}#label{position:fixed;top:12px;left:12px;max-width:90%;padding:10px;background:#132030dd}</style><canvas id="scene"></canvas><div id="label"></div><script type="module">
import {createView} from '../dist/render.js';import {createMatch,update,neutral} from '../dist/combat.js';import {boundaryGap} from '../dist/arena-bounds.js';
const view=createView(document.querySelector('canvas'),{quality:'low',talaModel:'graphic'});view.quality('low');window.loopView=view;let initialized=false;
window.loopReview=({flag='',stage='after',camera='duel'}={})=>{const m=createMatch(2,3,'duel','normal',{movement:'v2',arena:'ring',burst:'v2',step:'linear',capturewake:flag}),a=m.players[0],b=m.players[1];const draw=(dt=0,noDraw=false)=>view.render(dt,m,{quality:'low',reduced:true,camera,noDraw});if(!initialized){view.match(m,3);initialized=true;}
if(stage==='wake'){b.anim='getUp';b.getUp={frame:20,frames:28,safe:false};b.stun=.12;b.inv=0;m.projectiles.push({x:b.x-.05,z:b.z,dx:7,dz:0,owner:0,damage:12,kind:'capture',context:'far',radius:.65,life:1.8});update(m,[neutral(),neutral()]);draw(1/60,true);}
else{for(let i=0;i<600;i++){update(m,[{...neutral(),capture:i===0},neutral()]);draw(m.frozen?0:1/60,true);if(stage==='before'&&m.cinematic&&m.cinematic.t>=m.cinematic.duration-.05)break;if(stage==='after'&&b.hp<100)break;}}
draw();const result={flag,stage,camera,gap:Math.hypot(a.x-b.x,a.z-b.z),hp:m.players.map(p=>p.hp),positions:m.players.map(p=>({x:p.x,z:p.z,boundaryGap:boundaryGap(p)})),cinematic:m.cinematic?.kind||null,models:view.fighterModels};document.querySelector('#label').textContent=`${flag||'BASELINE'} · ${stage} · gap ${result.gap.toFixed(2)} · ${camera} camera · rule prototype; authored animation unchanged`;return result;};loopReview({stage:'before'});
</script></html>
