<!doctype html><html><head><meta charset="utf-8"><title>Rig review</title><link rel="icon" href="../dist/favicon.svg"><style>body{margin:0;background:#10191c;color:#eef1df;font:16px monospace}canvas{position:absolute;inset:0}header{position:absolute;top:30px;left:40px;z-index:1}footer{position:absolute;bottom:90px;left:0;width:100%;z-index:1}footer b{position:absolute;transform:translateX(-50%);white-space:nowrap}</style></head><body><header>RIFT DUEL / ORIGINAL ROSTER / RIG REVIEW</header><footer><b>AEGIS</b><b>REI</b><b>TALA</b><b>MORROW</b><b>SOL</b><b>VESPER</b></footer><script type="module">
import * as T from '../dist/vendor/three.module.js';import {buildCharacter} from '../dist/characters.js';import {animateCharacter} from '../dist/animation.js';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(devicePixelRatio);document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#10191c');const camera=new T.PerspectiveCamera(32,innerWidth/innerHeight,.1,100);camera.position.set(0,5,20);camera.lookAt(0,1.5,0);scene.add(new T.HemisphereLight('#dcf5ff','#444455',3));const light=new T.DirectionalLight('#fff5df',3);light.position.set(-3,8,9);scene.add(light);const models=[];for(let i=0;i<6;i++){const r=buildCharacter(i);r.g.position.x=(i-2.5)*3;scene.add(r.g);models.push(r);}camera.updateMatrixWorld();document.querySelectorAll('footer b').forEach((label,i)=>{const pos=new T.Vector3((i-2.5)*3,0,0).project(camera);label.style.left=((pos.x+1)*innerWidth/2)+'px';});function frame(t){models.forEach(r=>animateCharacter(r,null,t/1000));renderer.render(scene,camera);requestAnimationFrame(frame);}frame(0);
</script></body></html>
