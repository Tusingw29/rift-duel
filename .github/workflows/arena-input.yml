name: ARENA-INPUT preview checks
on:
  push:
    branches: [codex/arena-input]
    paths: ['dist/combat*', 'dist/commands.js', 'dist/movement-v2.js', 'dist/arena-*js', 'dist/morrow-preview.js', 'dist/render.js', 'dist/main.js', 'dist/skill/observer.js', 'scripts/skill/run.mjs', 'scripts/skill/arena-input.mjs', 'scripts/skill/arena-observer.mjs', 'scripts/skill/bots/**', 'scripts/review/arena-input.mjs', 'tests/arena-input*', '.github/workflows/arena-input.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        delay: [10, 15]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/skill/arena-input.mjs --delay=${{ matrix.delay }} --workers=2 --out=/tmp/arena-study-${{ matrix.delay }}
      - uses: actions/upload-artifact@v4
        with:
          name: arena-study-${{ matrix.delay }}
          path: /tmp/arena-study-${{ matrix.delay }}/
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run prepare:release
      - run: npm install --no-save --no-package-lock playwright@1.56.1 pngjs@7.0.0 jpeg-js@0.4.4
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4205 > /tmp/arena-http.log 2>&1 &
      - run: node scripts/review/arena-input.mjs
        env:
          RIFT_TOOLS: ${{ github.workspace }}
          RIFT_BASE: http://127.0.0.1:4205/dist
          SHOTS: /tmp/arena-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arena-browser
          path: /tmp/arena-browser/
