name: CONTROLS-VIEW preview checks
on:
  push:
    branches: [codex/controls-view]
    paths: ['dist/**.js', 'tests/controls*', 'scripts/review/controls-view.mjs', 'scripts/skill/controls-fixtures.mjs', '.github/workflows/controls-view.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/run-tests.mjs
      - run: npm run prepare:release
      - run: node scripts/skill/controls-fixtures.mjs /tmp/controls-fixtures.json
      - run: npm install --no-save --no-package-lock playwright@1.56.1 pngjs@7.0.0 jpeg-js@0.4.4
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4205 --bind :: > /tmp/controls-http.log 2>&1 &
      - run: node scripts/review/controls-view.mjs
        env:
          RIFT_TOOLS: ${{ github.workspace }}
          RIFT_BASE: http://127.0.0.1:4205/dist
          SHOTS: /tmp/controls-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controls-browser
          path: /tmp/controls-browser/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controls-fixtures
          path: /tmp/controls-fixtures.json
