<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rift Duel — Movement playtest</title><style>body{font:16px system-ui;background:#101722;color:#e7edf8;margin:24px;max-width:1300px}a{color:#80dcff}table{border-collapse:collapse;min-width:680px}td,th{padding:10px;border-bottom:1px solid #435068;text-align:left}section{overflow:auto;margin:24px 0}p{max-width:85ch;line-height:1.5}small{color:#bec7db}</style><h1>Movement playtest</h1><p><a href="index.html?move=v2">Play movement v2</a> · <a href="index.html?move=v2&grab=slow">V2 + slower grabs</a> · <a href="index.html?move=v2&mode=training">Training</a> · <a href="skill-lab.html">Earlier studies</a></p><p id="status">Loading measured results…</p><main id="results"></main><script type="module">
import {winText} from './skill/grab-report.js';
const root=document.querySelector('#results');function paragraph(s){const p=document.createElement('p');p.textContent=s;root.append(p);}function table(title,headers,rows){const section=document.createElement('section'),h=document.createElement('h2'),t=document.createElement('table');h.textContent=title;for(const [i,row] of [headers,...rows].entries()){const tr=document.createElement('tr');for(const text of row){const c=document.createElement(i?'td':'th');c.textContent=text;tr.append(c);}t.append(tr);}section.append(h,t);root.append(section);}
try{const response=await fetch('../art/skill-lab/2026-10-29-move-v2/summary.json');if(!response.ok)throw Error('Results unavailable');const r=await response.json();document.querySelector('#status').textContent='6,480 bouts · five seeds · both seats · opt-in preview';r.findings.forEach(paragraph);table('Step comparisons',['Delay','Mode','Opponent','Wins; 95% range'],r.runs.flatMap(x=>Object.entries(x.outcomes).map(([op,o])=>[x.config.delay,x.config.mode,op,winText(o)+(op==='random'&&o.interval[0]<=.5?' — UNTRUSTED':'')])));table('Recovery punish evidence',['Delay','Mode','Opponent','Punish attempts','Whiff punishes landed'],r.runs.flatMap(x=>Object.entries(x.validity).map(([op,v])=>[x.config.delay,x.config.mode,op,v.punishAttemptsStarted,v.whiffPunishes])));table('Sidestep outcomes',['Attacker','Move','Distance','0f','6f','10f','15f'],r.dodgeRows);r.notes.forEach(paragraph);}catch(e){document.querySelector('#status').textContent=e.message;}
</script></html>
