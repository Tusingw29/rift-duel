name: CAPTURE-LOOP preview checks
on:
  push:
    branches: [codex/capture-loop]
    paths: ['dist/**', 'tests/capture-loop*', 'tests/fixtures/build-6f15287e3290/**', 'tests/fixtures/capture-loop-replays/**', 'scripts/capture-loop/**', 'scripts/review/capture-loop.mjs', '.github/workflows/capture-loop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/run-tests.mjs
      - run: npm run prepare:release
      - run: node scripts/capture-loop/isolated.mjs
      - run: node scripts/capture-loop/spacing-fixture.mjs
      - run: node scripts/capture-loop/study.mjs
      - run: node scripts/capture-loop/report.mjs
      - run: npm install --no-save --no-package-lock playwright@1.56.1 pngjs@7.0.0 jpeg-js@0.4.4
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4224 --bind :: > /tmp/capture-loop-http.log 2>&1 &
      - run: node scripts/review/capture-loop.mjs
        env:
          RIFT_TOOLS: ${{ github.workspace }}
          RIFT_BASE: http://127.0.0.1:4224/dist
          SHOTS: /tmp/capture-loop-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-loop-browser
          path: /tmp/capture-loop-browser/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-loop-study
          path: art/review-2026-11-06/capture-loop/
