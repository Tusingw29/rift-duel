<!doctype html><html lang="en"><meta charset="utf-8"><base href="../dist/"><title>Controls camera review</title><style>body{margin:0;background:#101722;color:white;font:16px system-ui}canvas{width:100vw;height:100vh;display:block}#label{position:fixed;top:12px;left:12px;background:#121b28dd;padding:10px}</style><canvas id="scene"></canvas><div id="label"></div><script type="module">
import {createView} from '../dist/render.js';import {createMatch} from '../dist/combat.js';import {Vector3} from '../dist/vendor/three.module.js';import {createControlMapper,cameraRight,controlsCamera} from '../dist/controls-view.js';
const view=createView(document.querySelector('canvas'),{quality:'low',talaModel:'graphic'});view.quality('low');window.controlView=view;let ready=false;
window.reviewControls=({scheme='side',gap=3.25,angle=0,noDraw=false}={})=>{const m=createMatch(3,2,'duel','normal',{movement:'v2',arena:'ring',burst:'v2',step:'linear'}),[a,b]=m.players,t=angle*Math.PI/180;a.x=-Math.cos(t)*gap/2;a.z=-Math.sin(t)*gap/2;b.x=-a.x;b.z=-a.z;a.lookX=Math.cos(t);a.lookZ=Math.sin(t);b.lookX=-a.lookX;b.lookZ=-a.lookZ;if(!ready){view.match(m,3);ready=true;}view.render(0,m,{camera:controlsCamera(scheme,'duel'),reduced:true,quality:'low',noDraw});const cam=view.camera,project=(p,y=1.65)=>{const v=new Vector3(p.x,y,p.z).project(cam);return {x:(v.x+1)*innerWidth/2,y:(1-v.y)*innerHeight/2};},p=project(a),q=project(b),dx=q.x-p.x,dy=q.y-p.y;const keys=Object.entries({A:{x:-1,z:0},D:{x:1,z:0},W:{x:0,z:-1},S:{x:0,z:1}}).map(([key,raw])=>{const mapper=createControlMapper(scheme),i=mapper.map(raw,a,b,cameraRight(cam)),v={x:a.x+.1*(i.x*Math.cos(t)-i.z*Math.sin(t)),z:a.z+.1*(i.x*Math.sin(t)+i.z*Math.cos(t))},start=project(a,0),end=project(v,0);return {key,relative:i,side:mapper.sign,screenX:end.x-start.x,screenY:end.y-start.y};});document.querySelector('#label').textContent=`${scheme.toUpperCase()} · gap ${gap} · angle ${angle}° · centres ${Math.abs(dx).toFixed(1)}px apart horizontally`;return {scheme,gap,angle,width:innerWidth,height:innerHeight,horizontalPixels:Math.abs(dx),verticalPixels:Math.abs(dy),horizontalPercent:100*Math.abs(dx)/innerWidth,centreDistancePixels:Math.hypot(dx,dy),keys,models:view.fighterModels};};reviewControls();
</script></html>
