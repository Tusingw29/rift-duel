<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sidestep playtest results</title><style>body{background:#101722;color:#e8edf5;font:16px/1.55 system-ui;margin:0;padding:clamp(14px,3vw,40px)}main{max-width:1200px;margin:auto}h1{font-size:clamp(26px,4vw,44px)}a{color:#8bd5ff}section{margin:32px 0}.scroll{overflow:auto;border:1px solid #415166;border-radius:8px}table{border-collapse:collapse;min-width:700px;width:100%;font-size:14px}th,td{padding:10px 12px;border-bottom:1px solid #334254;text-align:left}th{background:#243347}.cards{display:flex;gap:12px;flex-wrap:wrap}.cards a{padding:12px;background:#243347;border-radius:8px}select{font:inherit;background:#243347;color:white;padding:8px}#error{color:#ffb8b8}</style><main><p>RIFT DUEL / OPT-IN PLAYTEST</p><h1>Sidesteps: straight attacks and sweeps</h1><p>Default gameplay is unchanged. Compare the existing Horizon rules with narrow attack paths and the optional heavy Morrow jab.</p><nav class="cards"><a href="index.html?move=v2&arena=ring&burst=v2&step=linear">Play linear attacks</a><a href="index.html?move=v2&arena=ring&burst=v2&step=linear&morrow=jab15heavy">Play linear + heavy Morrow</a></nav><p><a href="horizon-lab.html">Previous Horizon results</a> · <a href="../art/review-2026-10-30/sidestep-linear/README.md">Full report and escape frames</a></p><div id="findings"></div><label>Reaction delay <select id="delay"><option>10</option><option selected>15</option></select></label> <label>Policy <select id="policy"><option value="combined">All three combined</option><option>stepper</option><option>punisher</option><option selected>side-stepper</option></select></label><div id="tables"></div><p id="error"></p></main><script type="module">
import {winText} from './skill/grab-report.js';
const el=(tag,text)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e;};
function table(title,heads,rows){const section=el('section');section.append(el('h2',title));const wrap=el('div');wrap.className='scroll';const t=el('table'),head=el('tr');for(const h of heads)head.append(el('th',h));t.append(head);for(const row of rows){const tr=el('tr');for(const value of row)tr.append(el('td',String(value)));t.append(tr);}wrap.append(t);section.append(wrap);return section;}
try{const response=await fetch('../art/skill-lab/2026-10-30-sidestep-linear/summary.json');if(!response.ok)throw Error('Results are not ready yet');const data=await response.json();for(const line of data.findings)document.querySelector('#findings').append(el('p',line));function render(){const d=Number(document.querySelector('#delay').value),policy=document.querySelector('#policy').value,runs=data.runs.filter(r=>r.config.delay===d),root=document.querySelector('#tables');root.replaceChildren();root.append(table('Wins and bout length',['Mode','Opponent','Policy wins; 95%','Masher wins; 95%','Draws','Mean seconds'],runs.flatMap(r=>Object.entries(r.outcomes).filter(([k])=>k.startsWith(policy+'/')).map(([k,v])=>[r.config.mode,k.split('/')[1],winText(v.skilled),winText(v.masher),v.skilled.draws,v.seconds.toFixed(1)]))));root.append(table('Differences vs Horizon',['Mode','Opponent','Policy gain','Interpretation'],data.comparisons.filter(c=>c.delay===d&&c.key.startsWith(policy+'/')).map(c=>[c.mode,c.key.split('/')[1],c.difference.toFixed(1)+' percentage points',c.label])));root.append(table('Steps and tracking counters',['Mode','Opponent','Side','Steps started','Tracking opportunities / catches','Catches: travel / recovery','Linear opportunities / catches'],runs.flatMap(r=>Object.entries(r.steps).filter(([k])=>k.startsWith(policy+'/')).flatMap(([k,v])=>Object.entries(v).map(([role,s])=>[r.config.mode,k.split('/')[1],role,s.sidestepsStarted,s.trackingStepOpportunities+' / '+s.trackingStepCatches,s.trackingTravelCatches+' / '+s.trackingRecoveryCatches,s.linearStepOpportunities+' / '+s.linearStepCatches])))));root.append(table('Moves that counter stepping',['Fighter','Move','Startup','Active','Recovery'],data.tracking.map(t=>[t.fighter,t.name,t.startup,t.active,t.recovery])));const note=el('p','Catches belong to the attacking side; steps started belong to the stepping side. Opportunities depend on these policies. Overlapping ranges mean could be luck. Full methods and every escape-frame fixture are in the linked report.');root.append(note);}document.querySelector('#delay').onchange=render;document.querySelector('#policy').onchange=render;render();}catch(e){document.querySelector('#error').textContent=e.message;}
</script></html>
