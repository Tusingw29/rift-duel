<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rift Duel — Arena and input playtest</title><style>body{font:16px system-ui;background:#101722;color:#e7edf8;margin:24px;max-width:1400px}a{color:#80dcff}table{border-collapse:collapse;min-width:680px}td,th{padding:10px;border-bottom:1px solid #435068;text-align:left}section{overflow:auto;margin:24px 0}p{max-width:90ch;line-height:1.5}</style><h1>Arena and spacing playtest</h1><p><a href="index.html?move=v2&arena=ring">Ring</a> · <a href="index.html?move=v2&arena=ring&grab=slow">Ring + slower grabs</a> · <a href="index.html?move=v2&arena=ring&morrow=jab15">Ring + Morrow jab 15</a> · <a href="index.html?move=v2&arena=rect">Rectangle comparison</a> · <a href="move-lab.html">Earlier movement study</a></p><p id="status">Loading measurements…</p><main id="results"></main><script type="module">
import {winText} from './skill/grab-report.js';const root=document.querySelector('#results');function para(text){const p=document.createElement('p');p.textContent=text;root.append(p);}function table(title,headers,rows){const section=document.createElement('section'),h=document.createElement('h2'),t=document.createElement('table');h.textContent=title;for(const [i,row] of [headers,...rows].entries()){const tr=document.createElement('tr');for(const text of row){const c=document.createElement(i?'td':'th');c.textContent=text;tr.append(c);}t.append(tr);}section.append(h,t);root.append(section);}
try{const response=await fetch('../art/skill-lab/2026-10-29-arena-input/summary.json');if(!response.ok)throw Error('Results not available yet');const r=await response.json();document.querySelector('#status').textContent='11,520 bouts · five seeds · mirrored seats · opt-in only';r.findings.forEach(para);table('Wins on both sides',['Delay','Mode','Policy / opponent','Skilled wins; 95%','Masher wins; 95%','Draws'],r.runs.flatMap(x=>Object.entries(x.outcomes).map(([key,v])=>[x.config.delay,x.config.mode,key,winText(v.skilled),winText(v.masher),v.skilled.draws])));table('Comparison uncertainty',['Delay','Mode','Baseline','Opponent','Skilled gain','Interpretation'],r.comparisons.map(c=>[c.delay,c.mode,c.baseline,c.opponent,c.difference.toFixed(1)+' pp',c.label]));table('Edge pressure per bout',['Delay','Mode','Pair','Side','Edge seconds','Corner seconds','Pinned hits','Pinned bouts'],r.runs.flatMap(x=>Object.entries(x.edge).filter(([key])=>key.startsWith('skilled/')).flatMap(([key,roles])=>Object.entries(roles).map(([role,v])=>[x.config.delay,x.config.mode,key,role,v.edgeSecondsPerBout.toFixed(2),v.cornerSecondsPerBout===null?'N/A':v.cornerSecondsPerBout.toFixed(2),v.pinsPerBout.toFixed(3),`${v.pinnedBouts}/${v.bouts}`]))));table('Morrow matchup wins',['Delay','Mode','Morrow controller / rival','Morrow wins; 95%'],r.runs.filter(x=>['v2-ring','v2-ring-jab15'].includes(x.config.mode)).flatMap(x=>Object.entries(x.morrow).map(([key,v])=>[x.config.delay,x.config.mode,key,winText(v)])));r.notes.forEach(para);}catch(e){document.querySelector('#status').textContent=e.message;}
</script></html>
